name: CI

on:
  push:
    branches: [ main, dev, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]

# Read-only by default; only the release job elevates to contents: write.
permissions:
  contents: read

# A superseded PR run has nothing left to prove, and it would sit on lab
# runners that later commits need. Cancel it; never cancel a branch or tag
# run, whose result is the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on the fivetwenty-io self-hosted lab runners, inside a
# golang container: the runner hosts are intentionally minimal (docker and
# little else), and mixing host jobs with container jobs leaves the shared
# workspace with files owned by two different uids (host runner user vs
# container root), which breaks checkout cleanup and trips git's
# dubious-ownership guard. The "Trust the checkout" step writes
# safe.directory at --system level (/etc/gitconfig): the checkout action
# writes it under its own HOME, which shell steps in the container do not
# share, so git run by go build's VCS stamping would otherwise exit 128 on
# the runner-user-owned .git.
#
# Actions are pinned to full commit SHAs, since tags are movable and these
# jobs execute on lab runners.
#
# Every cache is off. The runners are persistent, so the Actions cache
# service costs more to fetch and unpack than the work it saves, and
# setup-go's restore untars over Go's read-only module cache and floods the
# log with tar "Cannot open: File exists". The Go module and build caches
# are host directories bind-mounted into each container instead. They live
# outside _work, so the runner's workspace reclaim hook leaves them alone.
# GOCACHE is set explicitly because the runner overrides HOME to
# /github/home inside the container, which is wiped between jobs.
#
# The job graph is deliberately a chain, not a fan-out. This module links
# the Azure, AWS, GCP and STACKIT SDKs, so a single compile of the
# dependency tree is a heavy memory consumer, and a wide fan-out
# OOM-killed every container on the runner at once (exit 137). lint, test,
# build and security therefore run one after another rather than together,
# and GOFLAGS caps the compiler's own parallelism within each of them.
#
# timeout-minutes on every job: a hung job would otherwise hold a runner
# for GitHub's 6-hour default.

env:
  # -p bounds how many packages the toolchain compiles at once. It defaults
  # to the core count, which on these runners means enough concurrent
  # compiler processes to exhaust memory on the SDK packages.
  GOFLAGS: -p=4

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Run go fmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Found unformatted files:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # The pinned release must be built with a Go toolchain at least as new
      # as go.mod's target: golangci-lint parses the standard library with
      # its own go/types, and one built against an older toolchain refuses
      # to load the config outright. v2.12.2 (built with go1.26) died that
      # way on "the Go language version (go1.26) used to build golangci-lint
      # is lower than the targeted Go version (1.27.0)"; v2.13.1 is built
      # with go1.27.0. Bump this in lockstep with the container image.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          skip-cache: true
          skip-save-cache: true

  test:
    name: Test
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 60
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Download dependencies
        run: go mod download

      # -race in a container makes the larger packages slow enough to crowd
      # go test's 10 minute per-package default, which aborts the whole run
      # with a panic instead of a test failure.
      - name: Run tests
        run: go test -race -timeout 25m -coverprofile=coverage.txt -covermode=atomic ./...

      # This repository is private with no Codecov token, so an upload could
      # only ever fail. The profile ships as an artifact instead, so coverage
      # is still inspectable per run.
      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: error

  build:
    name: Build
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 60
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history, so git describe can name a real version to
          # stamp into the binaries.
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false

      # One job cross-compiling in sequence, not a matrix. The lab runners
      # are all linux/amd64, so a per-OS matrix bought nothing -- it already
      # set GOOS and GOARCH explicitly rather than reading the runner
      # platform -- while five simultaneous links of this dependency tree
      # were what exhausted the runner's memory.
      #
      # The link flags are the ones the Makefile uses, so a CI binary
      # reports the same version, commit, and build time `make build`
      # embeds instead of "dev" and "unknown". -s -w also keeps the linker
      # off the DWARF path, where cross-linking darwin/arm64 against the
      # runners' warm build cache has been failing outright with
      # "relocation target go:info... not defined".
      - name: Build every target
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          pkg=github.com/ocfp/ocfp-cli-go/internal/version
          version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          ldflags="-s -w"
          ldflags="${ldflags} -X ${pkg}.Version=${version}"
          ldflags="${ldflags} -X ${pkg}.GitCommit=$(git rev-parse --short HEAD)"
          ldflags="${ldflags} -X ${pkg}.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S')"
          ldflags="${ldflags} -X ${pkg}.GoVersion=$(go version | cut -d' ' -f3)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/ocfp-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "::group::build $target"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags "$ldflags" -o "$out" ./cmd/ocfp
            echo "::endgroup::"
          done
          ls -l dist

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocfp-binaries
          path: dist/ocfp-*
          if-no-files-found: error

  integration-test:
    name: Integration Tests
    runs-on: self-hosted
    container:
      image: golang:1.27
    timeout-minutes: 20
    needs: build
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocfp-binaries
          path: dist

      - name: Make binary executable
        run: chmod +x dist/ocfp-linux-amd64

      - name: Test CLI help
        run: ./dist/ocfp-linux-amd64 --help

      - name: Test version
        run: ./dist/ocfp-linux-amd64 version

      # No bloc is configured on the runner, so these exercise the command
      # wiring and argument parsing only; a missing environment is expected.
      - name: Test environment commands
        run: |
          ./dist/ocfp-linux-amd64 env list || true
          ./dist/ocfp-linux-amd64 env show || true

  security:
    name: Security Scan
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false

      # The real gate: govulncheck reports only advisories on code paths this
      # binary actually reaches, so a finding here is always actionable.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      # gosec is a report rather than a gate; the same gosec rules gate
      # production code inside golangci-lint, where the tree is clean. The
      # two disagree because the tree suppresses gosec with //nolint:gosec,
      # which golangci-lint honours and the gosec binary cannot read, so
      # this step re-reports findings that were already triaged. Code
      # scanning is unavailable on this private repository, so the SARIF
      # ships as an artifact instead of an upload.
      #
      # Pinned like govulncheck above: at @latest this step could change
      # behaviour with no commit behind it.
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload gosec report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gosec-results
          path: gosec-results.sarif
          if-no-files-found: error

  release:
    name: Release
    runs-on: self-hosted
    container:
      image: golang:1.27
    timeout-minutes: 30
    needs: [lint, test, build, integration-test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocfp-binaries
          path: dist

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ocfp-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ocfp-*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
