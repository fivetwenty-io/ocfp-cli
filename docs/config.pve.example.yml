---
# OCFP config.yml — Proxmox VE (PVE) example
#
# Default location: ~/.ocfp/config.yml
# Override via: OCFP_HOME env var or -f / --config flag.
#
# Top-level structure:
#   debug / verbose        — logging knobs
#   pve                    — global PVE credential defaults (shared across blocs)
#   tailscale              — global tailscale defaults (shared across blocs)
#   blocs                  — map of named OCFP blocs (one per datacenter / environment tier)
#
# PVE bloc names must match ^ocfp-[a-z0-9-]+$ (lab blocs use the ocfp-lab-<user> form).

debug: false
verbose: false

# ─── Global PVE credential defaults ───────────────────────────────────────────
# Per-bloc auth_token / token_secret / username / password override these.
# Use this section when all blocs share one PVE API token (common in a lab).
pve:
  # API token — preferred over username/password.
  # Format: <user>@<realm>!<token-name>  (e.g. ocfp-cpi@pve!wayne)
  auth_token: "ocfp-cpi@pve!wayne"
  token_secret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  # Username/password auth — fallback; leave blank when using API token.
  # username: "ocfp-cpi@pve"
  # password: ""

# ─── Global tailscale defaults ────────────────────────────────────────────────
# Per-bloc tailscale: section overrides these on a field-by-field basis.
# auth_key and auth_key_vault_path are mutually exclusive within any scope.
tailscale:
  # Literal auth key (reusable / ephemeral depending on Tailscale ACL).
  # auth_key: "tskey-auth-..."
  #
  # OR read the key from vault at bootstrap time ("path:field" notation).
  auth_key_vault_path: "secret/ocfp/wayne/tailscale:auth_key"
  tags:
    - "tag:ocfp"
    - "tag:bastion"
  accept_dns: true
  accept_routes: true
  ssh: true

# ─── Global cloudflare defaults ──────────────────────────────────────────────
# Cloudflare Tunnel (per-bloc). Disabled unless enabled: true. The ocfp CLI
# creates a remotely-managed tunnel via the CF API, installs a cloudflared
# connector on the bastion (via SMBIOS, like tailscale), and upserts wildcard
# CNAMEs so *.apps/*.system resolve through the tunnel for every client.
# Per-bloc cloudflare: section overrides these on a field-by-field basis.
cloudflare:
  enabled: true
  api_token_vault_path: "secret/config/ocfp-lab-wayne/cloudflare:api_token"
  zone: "fivetwenty.io"
  # tunnel_name defaults to "ocfp-lab-<bloc>"
  origin: "https://10.64.64.20"          # HAProxy (steady state)
  ssh_origin: "ssh://10.64.64.37:2222"
  # apps_domain/system_domain/ssh_hostname are per-bloc (see bloc override)

# ─── Blocs ────────────────────────────────────────────────────────────────────
blocs:
  # ── Wayne lab PVE bloc ──────────────────────────────────────────────────────
  ocfp-lab-wayne:
    # provider and iaas are synonyms; either is accepted.
    provider: pve
    iaas: pve

    # How `ocfp bastion init`/`ssh` reach the bastion. PVE has no cloud IP
    # discovery, and the SDN bridge IP is unreachable from an operator machine,
    # so set this to the bastion's tailscale FQDN (or 100.x IP). Omit only if
    # you always run from inside the bloc network or export PVE_BASTION_IP.
    bastion_ip: "ocfp-lab-wayne-bastion.<tailnet>.ts.net"

    # PVE API endpoint.  Host only (the CLI splits host / port / scheme).
    # Accepted forms:
    #   "sm-0.lab.fivetwenty.io"           → port 8006, https (default)
    #   "sm-0.lab.fivetwenty.io:8006"      → explicit port
    #   "https://sm-0.lab.fivetwenty.io"   → explicit scheme
    api_endpoint: "sm-0.lab.fivetwenty.io"

    # region maps to the PVE node name used for VM placement.
    # Leave empty to let the CLI auto-select the least-loaded online node.
    region: "pve"

    # Proxmox cluster nodes for multi-node AZ entries written to vault.
    # Each entry becomes a separate vault AZ entry under net/azs/{node}.
    # For a single-node lab, list just the one node.
    nodes:
      - "pve"

    # ── Authentication ─────────────────────────────────────────────────────
    # These override the global pve: defaults above.
    # API token auth (preferred — comment out or leave blank to inherit global).
    auth_token: "ocfp-cpi@pve!wayne"
    token_secret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

    # Username/password auth — only used when auth_token / token_secret are empty.
    # username: "ocfp-cpi@pve"
    # password: ""

    # ── TLS ────────────────────────────────────────────────────────────────
    # verify_ssl: false skips certificate verification — safe for self-signed
    # PVE certs in a private lab.  Set true when the PVE host has a CA-signed cert.
    verify_ssl: false

    # ── Storage ────────────────────────────────────────────────────────────
    # iso_storage — PVE storage that accepts ISO content and cloud-init snippets.
    # Used for cloud-image downloads and template auto-provisioning.
    iso_storage: "local"

    # ── Network ────────────────────────────────────────────────────────────
    network:
      # cidr / network_cidr — management network CIDR.
      cidr: "10.64.64.0/18"

      # DNS resolvers advertised to VMs.
      dns:
        - "1.1.1.1"
        - "8.8.8.8"

    # Top-level DNS resolvers (mirrors network.dns; kept for older path compat).
    dns:
      - "1.1.1.1"
      - "8.8.8.8"

    # ── Availability zones ─────────────────────────────────────────────────
    # For PVE, AZs are mapped to Proxmox node names.
    # When nodes: is set, the CLI populates these automatically.
    # Define explicitly to override auto-derivation.
    azs:
      z1:
        zone: "pve"

    # ── Subnets ────────────────────────────────────────────────────────────
    # OCFP carves the network CIDR into subnets named ocfp-0…ocfp-N.
    # Provide explicit entries to control which bridge each subnet lands on.
    subnets:
      - name: "ocfp-0"
        cidr: "10.64.64.0/20"
        availabilityZone: "z1"
        type: "ocfp"

    # ── Bastion ────────────────────────────────────────────────────────────
    bastion:
      # Template VM name on the PVE cluster.
      # OCFP auto-provisions from the catalog when the template is missing.
      # Catalog names: ubuntu-noble-template,
      #                ubuntu-noble-bastion-template (pre-baked firstboot units).
      image: "ubuntu-noble-bastion-template"

      # SSH user inside the cloned bastion VM.
      sshUser: "ubuntu"

      # Root disk size (GiB).  PVE cloud-init images start at 2-3 GiB;
      # OCFP resizes to rootDiskSize on first boot.
      rootDiskSize: 50

      # Authorized SSH keys injected via cloud-init.
      # Values: literal public key, "github/<username>", or "gitlab/<username>".
      keys:
        wayne: "github/wayneeseguin"

      git:
        user:
          name: "Wayne E. Seguin"
          email: "wayneeseguin@fivetwenty.io"

      genesis:
        enabled: true
        branch: "v3.1.x-dev"
        version_prefix: "3.1.0"

    # ── Genesis ────────────────────────────────────────────────────────────
    genesis:
      enabled: true
      branch: "v3.1.x-dev"
      version_prefix: "3.1.0"

    # ── Blobstore ──────────────────────────────────────────────────────────
    # PVE has no native object storage.
    # mode: local   → bucket-creation step is skipped (default for PVE).
    # mode: external → requires an S3-compatible endpoint (Ceph RGW, RustFS, etc.)
    blobstore:
      mode: "local"
      # External S3-compatible blobstore (uncomment when mode: external).
      # endpoint: "https://rgw.lab.fivetwenty.io"
      # region: "us-east-1"
      # access_key: "..."
      # secret_key: "..."
      # ca_cert: "/path/to/ca.crt"    # optional — for self-signed endpoints
      # path_style: true              # true for Ceph/RustFS (default true)

    # ── Artifacts (RustFS S3-compatible blobstore VM) ──────────────────────
    # Opt-in. Provisions a dedicated VM running RustFS on a ZFS/ext4/xfs data
    # disk, giving BOSH and Cloud Foundry an S3-compatible blobstore without
    # depending on an external object store. Requires provider: pve and
    # bastion to be enabled (the artifacts VM is only reachable from the
    # bastion's SDN).
    artifacts:
      enabled: true
      flavor: "artifacts"
      template: "ubuntu-2204-cloudinit"

      rustfs:
        version: "1.0.0-beta.7"   # beta.7+ required — earlier betas break S3 multipart uploads
        s3_port: 9000
        console_port: 9001

      data:
        disk_size_gib: 500
        storage_pool: "local-zfs"
        # filesystem: ext4 (default), xfs, or zfs. Avoid zfs when
        # storage_pool is itself ZFS-backed (nested ZFS wastes memory/IO).
        filesystem: "ext4"
        mountpoint: "/data"

      tls:
        # mode selects how the RustFS TLS certificate is sourced:
        #   internal-ca (default) — leaf issued from the bloc's own CA,
        #     minted on demand at secret/ocfp/{bloc}/ca and reused across
        #     runs. Verified TLS everywhere with zero extra config: the
        #     bastion trust store, aws-cli (via AWS_CA_BUNDLE), and BOSH/CF
        #     kits (via the CA pinned in vault) all pick it up automatically.
        #     Requires a reachable vault at bootstrap (the inception vault is
        #     started automatically if one isn't already running).
        #   self-signed — RustFS generates its own leaf on first boot with no
        #     shared CA; use --insecure/--no-verify-ssl or a manually
        #     distributed cert to talk to it. No vault dependency.
        #   disabled — plain HTTP, no TLS at all. Lab/throwaway use only.
        mode: "internal-ca"
        # common_name overrides the certificate CN; defaults to a name
        # derived from the bloc and VM hostname when unset.
        # common_name: "artifacts.example.com"

    # ── FQDNs ──────────────────────────────────────────────────────────────
    # Scheme: <base> is ocf.<user>.lab.fivetwenty.io; mgmt utilities sit under
    # .util.<base>, CF system endpoints under .system.<base>, and apps under
    # apps.<base>.
    fqdns:
      base: "ocf.wayne.lab.fivetwenty.io"
      mgmt:
        bosh: "bosh.util.ocf.wayne.lab.fivetwenty.io"
        vault: "vault.util.ocf.wayne.lab.fivetwenty.io"
      ocf:
        cf_api: "api.system.ocf.wayne.lab.fivetwenty.io"
        cf_login: "login.system.ocf.wayne.lab.fivetwenty.io"
        cf_uaa: "uaa.system.ocf.wayne.lab.fivetwenty.io"

    # ── Jumpbox users ──────────────────────────────────────────────────────
    jumpbox:
      users:
        admin: "github/wayneeseguin"

    # ── Per-bloc tailscale override ────────────────────────────────────────
    # All fields are optional; unset fields inherit from the global tailscale:.
    tailscale:
      hostname: "bastion-wayne"
      tags:
        - "tag:ocfp"
        - "tag:bastion"
      accept_dns: true
      accept_routes: true
      ssh: true

    # ── Per-bloc cloudflare override ───────────────────────────────────────
    # All fields are optional; unset fields inherit from the global cloudflare:.
    cloudflare:
      enabled: true
      origin: "https://10.64.64.20"      # HAProxy — routes as soon as it comes up
      apps_domain: "apps.ocf.wayne.lab.fivetwenty.io"
      system_domain: "system.ocf.wayne.lab.fivetwenty.io"
      ssh_hostname: "ssh.system.ocf.wayne.lab.fivetwenty.io"
      origin_server_name: "api.system.ocf.wayne.lab.fivetwenty.io"
